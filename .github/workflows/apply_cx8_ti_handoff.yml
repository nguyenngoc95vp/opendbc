name: Apply CX-8 TI handoff tune

on:
  push:
    branches: [cx8-ti-handoff-kp06]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply CX-8 TI handoff tune') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cx8-ti-handoff-kp06
          fetch-depth: 1

      - name: Patch Mazda TI handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('opendbc/car/mazda/carcontroller.py')
          s = p.read_text()

          old = '''LONG_BUSES = (0, 2)\n'''
          new = '''LONG_BUSES = (0, 2)\n\n# Driver takeover: yield immediately on steering-wheel input, keep TI alive and\n# transmitting zero torque, then wait 100 ms after release before a 500 ms ramp back.\nTI_HANDOFF_RELEASE_DELAY_FRAMES = int(0.10 / DT_CTRL)\nTI_HANDOFF_RAMP_FRAMES = int(0.50 / DT_CTRL)\n'''
          if old not in s or 'TI_HANDOFF_RELEASE_DELAY_FRAMES' not in s:
            raise SystemExit('missing LONG_BUSES anchor')
          if 'TI_HANDOFF_RAMP_FRAMES' not in s:
            s = s.replace(old, new, 1)

          old = '''    self.release_ramp = None\n    self.breakaway_frames = 0\n'''
          new = '''    self.release_ramp = None\n    self.breakaway_frames = 0\n    self.ti_handoff_active = False\n    self.ti_handoff_hold_frames = 0\n    self.ti_handoff_ramp_frames = 0\n'''
          if old not in s:
            raise SystemExit('missing controller state anchor')
          if 'self.ti_handoff_active' not in s:
            s = s.replace(old, new, 1)

          old = '''    apply_torque = 0\n    ti_apply_torque = 0\n\n    # Speed-dependent STEER_MAX'''
          new = '''    apply_torque = 0\n    ti_apply_torque = 0\n\n    # Driver takeover state machine. This does NOT disable TI: TI readiness/state is\n    # left untouched and create_ti_steering_control() continues to send every frame.\n    ti_takeover_capable = bool(self.CP.flags & MazdaFlags.TORQUE_INTERCEPTOR) and CS.ti_lkas_allowed\n    driver_touch = bool(CC.latActive and ti_takeover_capable and CS.out.steeringPressed)\n\n    if not CC.latActive or not ti_takeover_capable:\n      self.ti_handoff_active = False\n      self.ti_handoff_hold_frames = 0\n      self.ti_handoff_ramp_frames = 0\n    elif driver_touch:\n      # Immediate hand-back: the very next CAN command is zero torque.\n      self.ti_handoff_active = True\n      self.ti_handoff_hold_frames = 0\n      self.ti_handoff_ramp_frames = 0\n    elif self.ti_handoff_active:\n      if self.ti_handoff_hold_frames < TI_HANDOFF_RELEASE_DELAY_FRAMES:\n        self.ti_handoff_hold_frames += 1\n      elif self.ti_handoff_ramp_frames < TI_HANDOFF_RAMP_FRAMES:\n        self.ti_handoff_ramp_frames += 1\n      else:\n        self.ti_handoff_active = False\n\n    handoff_scale = 1.0\n    if self.ti_handoff_active:\n      if self.ti_handoff_hold_frames < TI_HANDOFF_RELEASE_DELAY_FRAMES:\n        handoff_scale = 0.0\n      else:\n        handoff_scale = min(1.0, self.ti_handoff_ramp_frames / TI_HANDOFF_RAMP_FRAMES)\n\n    # Speed-dependent STEER_MAX'''
          if old not in s:
            raise SystemExit('missing update anchor')
          if 'ti_takeover_capable' not in s:
            s = s.replace(old, new, 1)

          old = '''      self.ti_apply_torque_last = ti_apply_torque\n\n    # Under op-long,'''
          new = '''      self.ti_apply_torque_last = ti_apply_torque\n\n    # Apply the same hand-back envelope to both host OP steering and TI steering.\n    # During the takeover window both are explicitly zero; TI itself remains running.\n    if self.ti_handoff_active:\n      apply_torque = int(round(apply_torque * handoff_scale))\n      ti_apply_torque = int(round(ti_apply_torque * handoff_scale))\n      if handoff_scale == 0.0:\n        apply_torque = 0\n        ti_apply_torque = 0\n        self.ti_rt_torque_last = 0\n        self.ti_rt_torque_last_ts = now_nanos\n\n    # Under op-long,'''
          if old not in s:
            raise SystemExit('missing TI handoff insertion anchor')
          if 'Apply the same hand-back envelope' not in s:
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply_cx8_ti_handoff.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opendbc/car/mazda/carcontroller.py .github/workflows/apply_cx8_ti_handoff.yml
          git commit -m 'Apply CX-8 TI handoff tune'
          git push origin HEAD:cx8-ti-handoff-kp06
