name: CX8 TI handoff patch v2

on:
  push:
    branches:
      - cx8-ti-handoff-0.5s

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cx8-ti-handoff-0.5s
          fetch-depth: 1
          submodules: false

      - name: Patch CX8 TI handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('opendbc/car/mazda/carcontroller.py')
          s = p.read_text()
          replacements = [
            (
              '''# Driver takeover: yield immediately on steering-wheel input, keep TI alive and\n# transmitting zero torque, then wait 100 ms after release before a 500 ms ramp back.\nTI_HANDOFF_RELEASE_DELAY_FRAMES = int(0.10 / DT_CTRL)\nTI_HANDOFF_RAMP_FRAMES = int(0.50 / DT_CTRL)''',
              '''# Driver takeover: yield immediately on steering-wheel input, keep TI alive and\n# transmitting zero torque, then hold zero torque for 500 ms after release before\n# immediately restoring the requested OP + TI torque. No ramp is used.\nTI_HANDOFF_RELEASE_DELAY_FRAMES = int(0.50 / DT_CTRL)'''
            ),
            (
              '''    self.ti_handoff_active = False\n    self.ti_handoff_hold_frames = 0\n    self.ti_handoff_ramp_frames = 0''',
              '''    self.ti_handoff_active = False\n    self.ti_handoff_hold_frames = 0'''
            ),
            (
              '''    if not CC.latActive or not ti_takeover_capable:\n      self.ti_handoff_active = False\n      self.ti_handoff_hold_frames = 0\n      self.ti_handoff_ramp_frames = 0\n    elif driver_touch:\n      # Immediate hand-back: the very next CAN command is zero torque.\n      self.ti_handoff_active = True\n      self.ti_handoff_hold_frames = 0\n      self.ti_handoff_ramp_frames = 0\n    elif self.ti_handoff_active:\n      if self.ti_handoff_hold_frames < TI_HANDOFF_RELEASE_DELAY_FRAMES:\n        self.ti_handoff_hold_frames += 1\n      elif self.ti_handoff_ramp_frames < TI_HANDOFF_RAMP_FRAMES:\n        self.ti_handoff_ramp_frames += 1\n      else:\n        self.ti_handoff_active = False\n\n    handoff_scale = 1.0\n    if self.ti_handoff_active:\n      if self.ti_handoff_hold_frames < TI_HANDOFF_RELEASE_DELAY_FRAMES:\n        handoff_scale = 0.0\n      else:\n        handoff_scale = min(1.0, self.ti_handoff_ramp_frames / TI_HANDOFF_RAMP_FRAMES)''',
              '''    if not CC.latActive or not ti_takeover_capable:\n      self.ti_handoff_active = False\n      self.ti_handoff_hold_frames = 0\n    elif driver_touch:\n      # Immediate hand-back: the very next CAN command is zero torque.\n      self.ti_handoff_active = True\n      self.ti_handoff_hold_frames = 0\n    elif self.ti_handoff_active:\n      # Hold both OP and TI at zero for 0.50 s after the driver releases\n      # the wheel, then restore both immediately with no ramp.\n      if self.ti_handoff_hold_frames + 1 >= TI_HANDOFF_RELEASE_DELAY_FRAMES:\n        self.ti_handoff_hold_frames = TI_HANDOFF_RELEASE_DELAY_FRAMES\n        self.ti_handoff_active = False\n      else:\n        self.ti_handoff_hold_frames += 1\n\n    handoff_scale = 0.0 if self.ti_handoff_active else 1.0'''
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit('target text not found')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add opendbc/car/mazda/carcontroller.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Set CX8 TI driver takeover hold to 0.5s without ramp'
          git push origin HEAD:cx8-ti-handoff-0.5s

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TI_HANDOFF_RELEASE_DELAY_FRAMES = int(0.50 / DT_CTRL)' opendbc/car/mazda/carcontroller.py
          ! grep -q 'TI_HANDOFF_RAMP_FRAMES' opendbc/car/mazda/carcontroller.py
          grep -q 'handoff_scale = 0.0 if self.ti_handoff_active else 1.0' opendbc/car/mazda/carcontroller.py
          grep -q 'create_ti_steering_control(self.packer, ti_apply_torque)' opendbc/car/mazda/carcontroller.py
